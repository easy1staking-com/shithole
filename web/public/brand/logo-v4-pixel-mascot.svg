<!--
  v4 — Pixel mascot (grimy/punk angle).

  16-bit-style swirl on a pixel grid. Maximally on-brand for the
  "embrace the worthlessness" direction. Pairs well with the existing
  pixel-art NFT collections we're targeting (Hosky CashGrab etc.).

  - 24x24 pixel grid scaled up via integer multiples.
  - Each "pixel" is a 1x1 unit; shape sketched by hand.
  - Dark mud-brown + accent highlight; no gradients.
  - Designed to read at 32x32 favicon AND 256x256 social-avatar sizes
    with the same chunky integrity.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges" role="img" aria-label="s#!thole mascot">
  <!-- backdrop pixel (rounded so it doesn't fight the chunky inside) -->
  <rect width="24" height="24" rx="3" fill="#0a0a0a"/>
  <!-- swirl, hand-painted pixel by pixel -->
  <g fill="var(--accent, #b87333)">
    <!-- outer ring -->
    <rect x="6" y="3" width="12" height="1"/>
    <rect x="4" y="4" width="2" height="1"/>
    <rect x="18" y="4" width="2" height="1"/>
    <rect x="3" y="5" width="1" height="2"/>
    <rect x="20" y="5" width="1" height="2"/>
    <rect x="3" y="17" width="1" height="2"/>
    <rect x="20" y="17" width="1" height="2"/>
    <rect x="4" y="19" width="2" height="1"/>
    <rect x="18" y="19" width="2" height="1"/>
    <rect x="6" y="20" width="12" height="1"/>
    <!-- right wall -->
    <rect x="20" y="7" width="1" height="10"/>
    <!-- spiral inward -->
    <rect x="7" y="6" width="9" height="1"/>
    <rect x="6" y="7" width="1" height="6"/>
    <rect x="16" y="7" width="1" height="6"/>
    <rect x="7" y="13" width="9" height="1"/>
    <rect x="9" y="9" width="5" height="1"/>
    <rect x="9" y="10" width="1" height="2"/>
    <rect x="13" y="10" width="1" height="2"/>
    <rect x="9" y="12" width="5" height="1"/>
    <rect x="11" y="11" width="1" height="1"/>
    <!-- bottom drip -->
    <rect x="11" y="15" width="2" height="2"/>
    <rect x="12" y="17" width="1" height="1"/>
  </g>
</svg>
