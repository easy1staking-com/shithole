<!--
  v6 — Classic poop, stylised.

  The 💩 emoji's silhouette redrawn as a clean vector — three coiled
  blobs stacked with a smooth highlight. Same coil-spiral language as
  the drain swirl (v1/v2) so the brand still has a unified visual idea.

  - currentColor for the form; accent for the highlight stripe + eyes.
  - Eye-less by default (drop the `<g class="face">` block to keep it
    serious); the playful "two-eye" variant lives in v8.
  - Designed at 64x64 viewBox; reads crisp from 24px favicon up to
    512px social-avatar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="s#!thole poop mark">
  <defs>
    <linearGradient id="poop6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#5a2d0c"/>
    </linearGradient>
  </defs>
  <!-- Three coiled tiers, stacked like the emoji.
       Each tier is a horizontal ellipse capped with a small spiral
       on top, the pile widening downward. -->
  <g fill="url(#poop6)" stroke="#3a1e08" stroke-width="0.8" stroke-linejoin="round">
    <!-- bottom pile (widest) -->
    <path d="M 6 54
             Q 6 44 14 42
             L 50 42
             Q 58 44 58 54
             Q 58 60 50 60
             L 14 60
             Q 6 60 6 54 Z"/>
    <!-- middle pile -->
    <path d="M 14 42
             Q 14 33 22 31
             L 42 31
             Q 50 33 50 42
             Z"/>
    <!-- top coil / tip -->
    <path d="M 22 31
             Q 22 22 30 21
             L 36 21
             Q 42 23 42 31
             Z"/>
    <!-- coil tip (the curl) -->
    <path d="M 30 21
             Q 28 14 32 14
             Q 36 14 36 18
             Q 36 21 34 21 Z"/>
  </g>
  <!-- subtle highlight on the front face -->
  <path d="M 18 38
           Q 18 35 22 35
           L 24 35
           Q 26 38 24 41
           L 20 41
           Q 18 41 18 38 Z"
        fill="var(--accent, #d9a157)" opacity="0.35"/>
</svg>
