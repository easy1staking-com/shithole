<!--
  v7 — Crowned poop ("king of trash").

  Same vector poop silhouette as v6, but wearing a tiny gold crown.
  Doubles down on the "ironic luxury" angle (matches the serif crest
  vibe of v3). The crown is the joke: dressing up worthlessness as
  if it's royalty. Maps directly to the brand promise — "your dead
  NFTs, but presented like fine art".

  - Crown uses the --accent var so it picks up per-pit colors
    (e.g. Hosky-gold #f5c518 on /pit/hosky).
  - Three-point crown is the smallest readable royal silhouette at
    favicon scale (32px).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="s#!thole crowned poop">
  <defs>
    <linearGradient id="poop7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#5a2d0c"/>
    </linearGradient>
    <linearGradient id="crown7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="var(--accent, #f5c518)"/>
    </linearGradient>
  </defs>
  <!-- crown sits at top of the canvas, slightly tilted -->
  <g transform="translate(32 12) rotate(-4)">
    <path d="M -12 4
             L -10 -6 L -6 1 L -2 -8 L 2 1 L 6 -6 L 10 -6 L 12 4 Z"
          fill="url(#crown7)" stroke="#a17a06" stroke-width="0.6" stroke-linejoin="round"/>
    <!-- gem -->
    <circle cx="-6" cy="-2" r="1" fill="#dc2626"/>
    <circle cx="2" cy="-3" r="1" fill="#16a34a"/>
    <circle cx="6" cy="-2" r="1" fill="#2563eb"/>
  </g>

  <!-- poop body — slightly nudged down to fit the crown -->
  <g fill="url(#poop7)" stroke="#3a1e08" stroke-width="0.8" stroke-linejoin="round">
    <path d="M 6 54
             Q 6 44 14 42
             L 50 42
             Q 58 44 58 54
             Q 58 60 50 60
             L 14 60
             Q 6 60 6 54 Z"/>
    <path d="M 14 42
             Q 14 33 22 31
             L 42 31
             Q 50 33 50 42
             Z"/>
    <path d="M 22 31
             Q 22 24 30 22
             L 36 22
             Q 42 24 42 31
             Z"/>
  </g>
  <!-- accent shimmer on the front (where the wordmark accent stripe usually lands) -->
  <path d="M 18 38
           Q 18 35 22 35
           L 24 35
           Q 26 38 24 41
           L 20 41
           Q 18 41 18 38 Z"
        fill="var(--accent, #d9a157)" opacity="0.4"/>
</svg>
