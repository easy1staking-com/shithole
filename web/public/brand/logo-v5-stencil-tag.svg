<!--
  v5 — Stencil tag (street/graffiti angle).

  Inspired by a sprayed warehouse-wall tag — chunky condensed sans
  with negative-space bridges (the stencil look) + a paint-drip on the
  exclamation. Reads as "we don't take ourselves seriously" without
  being pixel-art retro.

  - Sans-serif heavy weight (Impact / Arial Black family).
  - Slight rotation for spray-can imperfection.
  - One paint-drip glyph descending from `!` adds character without
    making the wordmark hard to read.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="s#!thole">
  <style>
    .tag { font: 900 56px/1 "Arial Black", Impact, "Helvetica Neue Condensed", sans-serif; letter-spacing: -0.04em; }
  </style>
  <g transform="translate(0 0) rotate(-1.5 160 40)">
    <text class="tag" x="0" y="56" fill="currentColor">s#!thole</text>
    <!-- paint drip from the `!` (approximate x position) -->
    <path d="M 71 60 Q 70 70 72 76 L 72 72 Q 74 71 73 66 Z" fill="currentColor" opacity="0.85" />
  </g>
</svg>
