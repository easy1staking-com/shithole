<!--
  v3 — Ironic Serif Crest.

  Leans hard into "polished irony": fancy serif treating "Shithole" as
  if it's a luxury brand. Ornate dividers + uppercase letter-spaced
  tagline below.

  - Pure serif (Georgia/Garamond family).
  - Uppercase, generous letter-spacing.
  - Hairline rule + diamond ornament under the word.
  - No swirl/glyph — the word does all the work.
  - Looks comically out of place on a dApp about worthless NFTs,
    which IS the joke.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="s#!thole">
  <style>
    .word { font: 700 44px/1 Georgia, "Times New Roman", serif; letter-spacing: 0.06em; }
    .tag  { font: 400 9px/1 ui-monospace, "JetBrains Mono", monospace; letter-spacing: 0.5em; text-transform: uppercase; }
    .rule { stroke: currentColor; stroke-width: 0.6; opacity: 0.7; }
  </style>
  <text class="word" x="180" y="46" fill="currentColor" text-anchor="middle">S#!thole</text>
  <!-- ornament: hairline + diamond + hairline -->
  <g transform="translate(180 64)">
    <line class="rule" x1="-80" y1="0" x2="-8" y2="0" />
    <path d="M 0 -3 L 4 0 L 0 3 L -4 0 Z" fill="currentColor" opacity="0.7"/>
    <line class="rule" x1="8" y1="0" x2="80" y2="0" />
  </g>
  <text class="tag" x="180" y="84" fill="currentColor" text-anchor="middle" opacity="0.55">est. mainnet · 2026</text>
</svg>
