name: api-image

# Build + push the Shithole BE image to GHCR on every branch push and
# tag, and run a no-push build on PRs to catch breakage early.
#
# Tag strategy (via docker/metadata-action):
#   - push to dev    → :dev,    :dev-<sha7>,    :sha-<sha7>
#   - push to main   → :main,   :latest,        :sha-<sha7>
#   - tag v1.2.3     → :v1.2.3, :1.2.3, :1.2, :latest
#   - pull_request   → no push; build-only smoke
#
# Auth uses the built-in GITHUB_TOKEN — no secret setup required.
# The k8s cluster pulls via an imagePullSecret you provision separately
# (the package defaults to private on GHCR).

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]
    paths:
      # Trigger PR builds only when something the image cares about
      # changes — keeps the actions tab quiet.
      - "api/**"
      - "contracts/plutus.json"
      - ".github/workflows/api-image.yml"
      - ".dockerignore"

# Cancel superseded runs for the same ref — when commits land fast.
concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # required to push to ghcr.io/<owner>/...

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/shithole-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Shallow clone is fine — the Dockerfile doesn't read git
          # history. Full fetch would slow this down for no benefit.
          fetch-depth: 1

      # Buildx is required for layer caching + (if enabled later)
      # cross-arch builds. The default driver supports cache exports.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skip login on PRs from forks (no packages:write) — we'll only
      # do a no-push build for them.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            # Per-branch sha tag so 'dev-abc1234' is unambiguous when
            # multiple branches build the same sha.
            type=sha,prefix={{branch}}-,format=short,enable=${{ github.event_name == 'push' }}
            # :latest only on default branch + version tags
            type=raw,value=latest,enable=${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          labels: |
            org.opencontainers.image.title=shithole-api
            org.opencontainers.image.description=Shithole Cardano dApp BE — Yaci-Store indexer + REST API
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          # Single-arch (linux/amd64) for now. Most Cardano infra runs
          # on amd64 nodes. Flip to "linux/amd64,linux/arm64" if the
          # target cluster has ARM nodes — adds ~3× build time.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache — survives across runs in this repo.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Helpful when debugging a failed build: the full BuildKit
          # trace lands in the GitHub Actions log.
          provenance: false
