name: shithole-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: shithole-postgres
    environment:
      POSTGRES_USER: shithole
      POSTGRES_PASSWORD: shithole
      POSTGRES_DB: shithole
    # Bind to host :5433 so it doesn't collide with a host-level Postgres on
    # :5432 (homebrew Postgres on Giovanni's macOS dev machine). The container
    # internally still listens on 5432. IntelliJ-driven local dev points at the
    # host-level Postgres directly; this compose service is for headless / CI /
    # automation testing (e.g. when the conversation tool needs to spin DB up).
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shithole -d shithole"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

# Note: Yaci DevKit (local Cardano devnet + Yaci Store + Ogmios + Kupo) runs as
# a separate compose stack via the `devkit` script installed from devkit.yaci.xyz.
# Use `make devkit-start` / `make devkit-stop` to control it.
