spring:
  application:
    name: shithole-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shithole}
    username: ${DB_USERNAME:shithole}
    password: ${DB_PASSWORD:shithole}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema end-to-end. We disable Hibernate's schema validation
      # because Yaci Store still ships migrations whose declared column widths
      # don't match its own JPA entities: `address_utxo.output_index` is SMALLINT
      # in {@code db/store/postgresql/V0_200_1__init.sql} (yaci-store-utxo 2.1.0-pre3)
      # while {@code AddressUtxoEntity#outputIndex} is declared as
      # {@code java.lang.Integer}. {@code validate} would refuse to start. Until
      # the upstream entity uses {@code Short}/the migration uses {@code INT},
      # this stays at {@code none}.
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.lob.non_contextual_creation: true
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shithole}
    user: ${DB_USERNAME:shithole}
    password: ${DB_PASSWORD:shithole}
    locations:
      - classpath:db/store/{vendor}
      - classpath:db/store/shithole
    out-of-order: true

# Yaci Store config — points at local Yaci DevKit Cardano node by default.
# For preprod/mainnet, override via env vars or a profile.
#
# Property keys verified against yaci-store 2.1.0-pre3 (`store.cardano.*` ->
# `YaciStoreProperties$Cardano`, `store.utxo.*` -> `UtxoStoreAutoConfigProperties$Utxo`).
# `store.sync-auto-start` is now true: the indexer phase needs the upstream
# chain-sync loop running so `AddressUtxoEvent`s are published. Empty
# genesis-file paths fall back to a `ByronGenesis(protocolMagic)` stub in
# yaci-store 2.x — production deployments must supply real genesis paths via
# `store.cardano.*-genesis-file`.
store:
  sync-auto-start: ${YACI_SYNC_AUTO_START:true}
  cardano:
    host: ${REMOTE_NODE_URL:localhost}
    port: ${REMOTE_NODE_PORT:3001}
    # Default to preprod (protocol-magic=1) for headless dev because Yaci
    # Store 2.x's bundled genesis files only cover MAINNET / PREPROD / PREVIEW
    # / SANCHONET — Yaci DevKit's protocol-magic=42 falls outside that set and
    # boot fails unless DevKit is running and supplies genesis paths. Override
    # via `PROTOCOL_MAGIC=42` once DevKit is up.
    protocol-magic: ${PROTOCOL_MAGIC:1}
    # Operator-set starting slot + blockhash. Yaci 2.x requires BOTH to skip
    # ahead from genesis — passing only the slot makes Yaci fall back to a
    # genesis-onward sync (slow). Get a fresh pair from `./gradlew preprodCheckBalance`,
    # which prints the current tip's slot + hash. Leave both at the empty/0
    # defaults only if you're starting a fresh DevKit ledger.
    sync-start-slot: ${SHITHOLE_INDEXER_START_SLOT:0}
    sync-start-blockhash: ${SHITHOLE_INDEXER_START_BLOCKHASH:}
  utxo:
    pruning-enabled: false

# Network: devnet | preprod | preview | mainnet
network: ${NETWORK:devnet}

# Application network selector — controls address derivation + Blockfrost URL
# in the config-registration path. Independent of the indexer `network` key
# above so callers can run a mainnet config-registration flow against a
# devnet indexer during development. Accepted values: mainnet | preprod.
app:
  network: ${APP_NETWORK:mainnet}

# Blockfrost — used by the NFT metadata pipeline (docs/BACKEND.md §metadata)
# and by the config-registration endpoint (POST /api/configs).
# Empty URL default → BlockfrostConfig.defaultBlockfrostUrl() picks the URL
# based on `app.network` so callers don't accidentally hit mainnet when
# running against a non-mainnet network.
blockfrost:
  url: ${BLOCKFROST_URL:}
  project-id: ${BLOCKFROST_PROJECT_ID:}

# Application-level configuration.
shithole:
  # Public mount point for the REST API.
  api-prefix: /api

  # Indexer start slot — operator supplies the slot when deploying. Yaci Store
  # backfills only blocks at/after this slot for our scoped contract addresses.
  # `enabled` (default true) controls whether the listing-events indexer
  # components are wired. Disable at boot if the indexer is in the way.
  indexer:
    enabled: ${SHITHOLE_INDEXER_ENABLED:true}
    start-slot: ${SHITHOLE_INDEXER_START_SLOT:0}

  # Rebalancer (docs/BACKEND.md §rebalancer). Off by default; only the admin-private
  # profile turns this on alongside the ADMIN_SEED env var.
  rebalancer:
    enabled: false
    seed: ${ADMIN_SEED:}
    collections: []
    cron: "0 0 4 * * *"
    staleness-threshold: 3.0
    dry-run: false

  # CIP-171 config discovery (docs/BACKEND.md §CIP-171). Off for v1 bootstrap;
  # enabled once the Cip171Processor lands.
  cip171:
    enabled: false
    allowed-sources:
      - "https://github.com/easy1staking-com/shithole"
    allowed-compilers:
      - "v1.1.21"
    released-versions: []

  # Curation gate. Comma-separated list of lowercase-hex admin pkhs that
  # auto-promote into `curated_collections` (visible at GET /api/curated +
  # the FE). Anything outside this list lands in `configs` only — the
  # indexer still watches the listing-script address, but the public FE
  # doesn't surface the collection. Empty list = no auto-curation.
  curation:
    operator-pkhs: ${OPERATOR_PKHS:}

  # v3 wanted-listing pool-merkle service. The seeder reads `pools-resource`
  # at boot, recomputes every claimed root, and FAILS THE BOOT on mismatch
  # (catches resource tampering / merkle-tree-java drift before any in-flight
  # listing produces a 404). Disable only for tests that don't need the v3 path.
  p2p:
    enabled: ${SHITHOLE_P2P_ENABLED:true}
    pools-resource: ${SHITHOLE_P2P_POOLS_RESOURCE:classpath:p2p/pools.json.gz}
    fail-on-missing-resource: ${SHITHOLE_P2P_FAIL_ON_MISSING:true}

    # Autonomous P2P matcher bot. Off by default; opt-in by setting the env
    # var and supplying SHITHOLE_MATCHER_MNEMONIC (boot fails fast if
    # enabled but the mnemonic is missing). See api/docs/P2P_MATCHER.md.
    matcher:
      enabled: ${SHITHOLE_P2P_MATCHER_ENABLED:false}
      mnemonic: ${SHITHOLE_MATCHER_MNEMONIC:}   # NEVER commit
      collateral-ada: ${SHITHOLE_MATCHER_COLLATERAL_ADA:5}
      ogmios-url: ${OGMIOS_URL:}

    # Autonomous P2P auto-fulfill bot. Sibling loop to the matcher; shares
    # the SAME hot wallet (SHITHOLE_MATCHER_MNEMONIC) and the same per-block
    # trigger. Picks a single Fulfill per matched listing using the bot's
    # current NFT inventory (no auto-restock). See
    # api/docs/P2P_MATCHER.md §Auto-fulfill loop. Off by default; if enabled
    # without the matcher's mnemonic being set, boot fails fast.
    auto-fulfill:
      enabled: ${SHITHOLE_P2P_AUTO_FULFILL_ENABLED:false}
      max-per-block: ${SHITHOLE_P2P_AUTO_FULFILL_MAX_PER_BLOCK:3}
      ogmios-url: ${OGMIOS_URL:}

    # Shared bot guardrails (apply to BOTH matcher + auto-fulfill).
    bot:
      # When true, additionally reject candidates whose CONSERVATIVE
      # estimated net (assumes 1.5 ADA buyer-output, 1.5 ADA treasury,
      # 0.8-1.5 ADA tx fee) is non-positive. Default false: the on-chain
      # contract floor (protocol_fee + min_seller_compensation = 2 ADA)
      # is sufficient — above it, the validator guarantees tx balances.
      # Enable on mainnet only if you want extra headroom against fee
      # volatility.
      strict-profit-check: ${SHITHOLE_P2P_BOT_STRICT_PROFIT:false}

  # Bootstrap-only: paths to packaged JSON fixtures used by controllers
  # until DB-backed implementations are wired up.
  fixtures:
    curated: fixtures/api/curated.json

# Yaci Store 2.x's plugin/scheduler admin controllers expect a top-level
# `apiPrefix` property (used in `@RequestMapping("${apiPrefix}/admin/...")`).
# We mirror our application prefix here so Spring can resolve the placeholder
# during request-mapping registration. Without this, the WebMvc handler-mapping
# refresh fails at startup with "Could not resolve placeholder 'apiPrefix'".
apiPrefix: ${shithole.api-prefix:/api}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  level:
    root: INFO
    com.easy1staking.shithole: DEBUG
    com.bloxbean.cardano: INFO
