spring:
  application:
    name: shithole-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shithole}
    username: ${DB_USERNAME:shithole}
    password: ${DB_PASSWORD:shithole}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema end-to-end. We disable Hibernate's schema validation
      # because Yaci Store still ships migrations whose declared column widths
      # don't match its own JPA entities: `address_utxo.output_index` is SMALLINT
      # in {@code db/store/postgresql/V0_200_1__init.sql} (yaci-store-utxo 2.1.0-pre3)
      # while {@code AddressUtxoEntity#outputIndex} is declared as
      # {@code java.lang.Integer}. {@code validate} would refuse to start. Until
      # the upstream entity uses {@code Short}/the migration uses {@code INT},
      # this stays at {@code none}.
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.lob.non_contextual_creation: true
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shithole}
    user: ${DB_USERNAME:shithole}
    password: ${DB_PASSWORD:shithole}
    locations:
      - classpath:db/store/{vendor}
      - classpath:db/store/shithole
    out-of-order: true

# Yaci Store config — points at local Yaci DevKit Cardano node by default.
# For preprod/mainnet, override via env vars or a profile.
#
# Property keys verified against yaci-store 2.1.0-pre3 (`store.cardano.*` ->
# `YaciStoreProperties$Cardano`, `store.utxo.*` -> `UtxoStoreAutoConfigProperties$Utxo`).
# `store.sync-auto-start` defaults to true in 2.x; we hold it at false until the
# indexer phase explicitly opts in (auto-configs are currently excluded in
# {@code ShitholeApi} so these keys are inert for the bootstrap phase).
store:
  sync-auto-start: false
  cardano:
    host: ${REMOTE_NODE_URL:localhost}
    port: ${REMOTE_NODE_PORT:3001}
    protocol-magic: ${PROTOCOL_MAGIC:42}  # Yaci DevKit default
  utxo:
    pruning-enabled: false

# Network: devnet | preprod | preview | mainnet
network: ${NETWORK:devnet}

# Blockfrost — used by the NFT metadata pipeline (docs/BACKEND.md §metadata).
# Empty default; services that need it will fail fast on startup.
blockfrost:
  url: ${BLOCKFROST_URL:https://cardano-mainnet.blockfrost.io/api/v0/}
  project-id: ${BLOCKFROST_PROJECT_ID:}

# Application-level configuration.
shithole:
  # Public mount point for the REST API.
  api-prefix: /api

  # Indexer start slot — operator supplies the slot when deploying. Yaci Store
  # backfills only blocks at/after this slot for our scoped contract addresses.
  indexer:
    start-slot: <REPLACE_ME>

  # Rebalancer (docs/BACKEND.md §rebalancer). Off by default; only the admin-private
  # profile turns this on alongside the ADMIN_SEED env var.
  rebalancer:
    enabled: false
    seed: ${ADMIN_SEED:}
    collections: []
    cron: "0 0 4 * * *"
    staleness-threshold: 3.0
    dry-run: false

  # CIP-171 config discovery (docs/BACKEND.md §CIP-171). Off for v1 bootstrap;
  # enabled once the Cip171Processor lands.
  cip171:
    enabled: false
    allowed-sources:
      - "https://github.com/easy1staking-com/shithole"
    allowed-compilers:
      - "v1.1.21"
    released-versions: []

  # Bootstrap-only: paths to packaged JSON fixtures used by controllers
  # until DB-backed implementations are wired up.
  fixtures:
    curated: fixtures/api/curated.json

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  level:
    root: INFO
    com.easy1staking.shithole: DEBUG
    com.bloxbean.cardano: INFO
